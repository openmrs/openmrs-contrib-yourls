services:
  db:
    ports:
      - "3306:3306"
    image: mysql:5.6
    environment:
      - MYSQL_ROOT_PASSWORD=coolpassword
      - MYSQL_DATABASE=yourls
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - YOURLS_DB_USER=root
      - YOURLS_DB_PASS=coolpassword
      - YOURLS_DB_NAME=yourls
      - YOURLS_DB_HOST=db
      - YOURLS_DEBUG=false
      - YOURLS_USERS=default:default
      - YOURLS_COOKIEKEY=local-development-only
      - YOURLS_SITE=http://localhost
      - YOURLS_ADMIN_SSL=false
      - YOURLS_GA_TRACKING_ID=UA-12345678-90
      - YOURL_INDEX_WEBSITE=http://example.com/
      - YOURLS_UNIQUE_URLS=false
